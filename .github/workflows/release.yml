name: Release RabbitLens

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rabbitlens

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install frontend dependencies
        working-directory: website
        run: npm ci

      - name: Verify release candidate
        working-directory: website
        run: npm run check && npm run audit

      - name: Derive release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$(node -p "require('./website/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: website
          file: website/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Generate SPDX SBOM
        working-directory: website
        run: npm sbom --sbom-format spdx --package-lock-only > ../rabbitlens-${{ steps.version.outputs.version }}.spdx.json

      - name: Generate source archive and checksums
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=rabbitlens-${{ steps.version.outputs.version }}/ --output=rabbitlens-${{ steps.version.outputs.version }}-source.tar.gz "$GITHUB_SHA"
          sha256sum rabbitlens-${{ steps.version.outputs.version }}-source.tar.gz rabbitlens-${{ steps.version.outputs.version }}.spdx.json > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RabbitLens $GITHUB_REF_NAME" \
            --generate-notes \
            rabbitlens-${{ steps.version.outputs.version }}-source.tar.gz \
            rabbitlens-${{ steps.version.outputs.version }}.spdx.json \
            SHA256SUMS
