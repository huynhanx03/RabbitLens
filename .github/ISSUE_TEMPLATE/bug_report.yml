name: Bug report
description: Report a reproducible RabbitLens defect.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here. Use SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: RabbitLens version
      placeholder: "1.0.2"
    validations:
      required: true
  - type: input
    id: rabbitmq-version
    attributes:
      label: RabbitMQ version and enabled plugins
      placeholder: "4.3.2; rabbitmq_management, rabbitmq_stream_management"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour, logs, or screenshots
      description: Remove credentials, message payloads, hostnames, and other sensitive data.
    validations:
      required: true
